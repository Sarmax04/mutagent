[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mutagent"
version = "0.1.0"
description = "An agent that writes tests and is graded by mutation score, powered by NVIDIA Nemotron on Nebius Token Factory."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["openai>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mutagent = "mutagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
