[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mutagent"
version = "0.1.0"
description = "An agent that writes tests and is graded by mutation score, powered by NVIDIA Nemotron on Nebius Token Factory."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["openai>=1.40", "coverage>=7"]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
examples = ["text-unidecode>=1.3"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "text-unidecode>=1.3"]

[project.scripts]
mutagent = "mutagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mutagent = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
